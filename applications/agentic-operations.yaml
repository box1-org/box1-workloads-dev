---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "agentic-operations"
  namespace: openshift-gitops
  labels:
    backstage.io/kubernetes-id: agentic-operations
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-workloads-dev.git
    targetRevision: main
    path: workloads/agentic-operations
  destination:
    server: https://kubernetes.default.svc
    namespace: "agentic-operations-dev"
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - PruneLast=true
