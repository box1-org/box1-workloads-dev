---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "peggy-app"
  namespace: openshift-gitops
  labels:
    backstage.io/kubernetes-id: peggy-app
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-workloads-dev.git
    targetRevision: main
    path: workloads/peggy-app
  destination:
    server: https://kubernetes.default.svc
    namespace: "peggy-app-dev"
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - PruneLast=true
