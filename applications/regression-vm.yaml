---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "regression-vm"
  namespace: openshift-gitops
  labels:
    backstage.io/kubernetes-id: regression-vm
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-workloads-dev.git
    targetRevision: main
    path: workloads/regression-vm
  destination:
    server: https://kubernetes.default.svc
    namespace: "regression-vm-dev"
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - PruneLast=true
