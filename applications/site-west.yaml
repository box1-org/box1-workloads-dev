---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "site-west"
  namespace: openshift-gitops
  labels:
    backstage.io/kubernetes-id: site-west
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-workloads-dev.git
    targetRevision: main
    path: workloads/site-west
  destination:
    server: https://kubernetes.default.svc
    namespace: "site-west-dev"
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - PruneLast=true
