---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "qs-regression-check"
  namespace: openshift-gitops
  labels:
    backstage.io/kubernetes-id: qs-regression-check
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-workloads-dev.git
    targetRevision: main
    path: workloads/qs-regression-check
  destination:
    server: https://kubernetes.default.svc
    namespace: "qs-regression-check-dev"
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - PruneLast=true
