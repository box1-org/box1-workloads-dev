---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "operations-console"
  namespace: openshift-gitops
  labels:
    backstage.io/kubernetes-id: operations-console
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-workloads-dev.git
    targetRevision: main
    path: workloads/operations-console
  destination:
    server: https://kubernetes.default.svc
    namespace: "operations-console-dev"
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - PruneLast=true
