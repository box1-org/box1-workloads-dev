---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "blue-wave"
  namespace: openshift-gitops
  labels:
    backstage.io/kubernetes-id: blue-wave
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-workloads-dev.git
    targetRevision: main
    path: workloads/blue-wave
  destination:
    server: https://kubernetes.default.svc
    namespace: "blue-wave-dev"
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - PruneLast=true
