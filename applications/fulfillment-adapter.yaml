---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "fulfillment-adapter"
  namespace: openshift-gitops
  labels:
    backstage.io/kubernetes-id: fulfillment-adapter
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-workloads-dev.git
    targetRevision: main
    path: workloads/fulfillment-adapter
  destination:
    server: https://kubernetes.default.svc
    namespace: "fulfillment-adapter-dev"
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - PruneLast=true
