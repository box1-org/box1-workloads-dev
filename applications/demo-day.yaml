---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "demo-day"
  namespace: openshift-gitops
  labels:
    backstage.io/kubernetes-id: demo-day
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-workloads-dev.git
    targetRevision: main
    path: workloads/demo-day
  destination:
    server: https://kubernetes.default.svc
    namespace: "demo-day-dev"
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - PruneLast=true
