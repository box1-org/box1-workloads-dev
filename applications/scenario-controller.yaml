---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "scenario-controller"
  namespace: openshift-gitops
  labels:
    backstage.io/kubernetes-id: scenario-controller
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-workloads-dev.git
    targetRevision: main
    path: workloads/scenario-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: "scenario-controller-dev"
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - PruneLast=true
