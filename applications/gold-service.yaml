---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "gold-service"
  namespace: openshift-gitops
  labels:
    backstage.io/kubernetes-id: gold-service
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-workloads-dev.git
    targetRevision: main
    path: workloads/gold-service
  destination:
    server: https://kubernetes.default.svc
    namespace: "gold-service-dev"
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - PruneLast=true
