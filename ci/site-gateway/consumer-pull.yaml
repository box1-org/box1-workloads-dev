---
# The bootc build accounts of the consumer, box1-org/site-gateway-os, pull this bundle
# for its COPY --from line. Pull-only, this one ImageStream (box1-org/box1-gitops#140).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "site-gateway-bundle-pull"
  namespace: box1-ci
rules:
- apiGroups:
  - ''
  - image.openshift.io
  resources:
  - imagestreams/layers
  resourceNames:
  - "site-gateway-bundle"
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "site-gateway-bundle-pull"
  namespace: box1-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "site-gateway-bundle-pull"
subjects:
- kind: ServiceAccount
  name: ci-bootc-release
  namespace: box1-ci
- kind: ServiceAccount
  name: ci-bootc-check
  namespace: box1-ci
# PR builds pull as this account; ci-bootc-check has no token (box1-org/box1-gitops#141).
- kind: ServiceAccount
  name: ci-bundle-pull
  namespace: box1-ci
