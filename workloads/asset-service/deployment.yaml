apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-service
  namespace: asset-service-dev
  annotations:
    box1.org/source-revision: 0dc14dc8a32fd58ad5bb1daf9462f080dd1fb835
    box1.org/build-pipelinerun: box1-ci/onb-asset-service-0dc14dc8
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: asset-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asset-service
        app.kubernetes.io/part-of: box1-golden-path
    spec:
      serviceAccountName: asset-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: asset-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: asset-service-config
          # Settings added after onboarding live here, not in the hashed ConfigMap (box1-docs#42 lesson).
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ASSET_ENVIRONMENT
              value: dev
            # Load runs (not chaos) are allowed here; chaos also needs the allowlist below.
            - name: ASSET_CONTROL_ENABLED
              value: 'true'
            # Chaos stays off until the user names the namespace where it is allowed (box1-docs#15 D-015).
            - name: ASSET_CHAOS_ENABLED
              value: 'false'
            - name: ASSET_CHAOS_NAMESPACE_ALLOWLIST
              value: ''
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://asset-service-postgres:5432/asset_service
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: asset-service-postgres
                  key: POSTGRESQL_USER
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asset-service-postgres
                  key: POSTGRESQL_PASSWORD
            - name: JDK_JAVA_OPTIONS
              value: -XX:+ExitOnOutOfMemoryError

          resources:
            requests:
              cpu: 100m
              # Measured RSS 213-232 MiB at 50 readings/s with a 256 MiB heap; consumer catch-up adds fetch buffers.
              memory: 320Mi
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
