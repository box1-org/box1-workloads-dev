apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: asset-service
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml
  - postgres.yaml

configMapGenerator:
  - name: asset-service-config
    namespace: asset-service-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp


      - KAFKA_BOOTSTRAP_SERVERS=box1-kafka-kafka-bootstrap.box1-kafka.svc:9092

images:
  - name: asset-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/asset-service
    digest: sha256:4d8623986033b87bea25bed9461f0731e6616f47de00cc1bf21132dbbf0675d0
