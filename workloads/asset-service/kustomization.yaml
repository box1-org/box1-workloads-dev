apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: asset-service
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml
  - rolebinding-agentic-operations-observe.yaml
  - postgres.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: asset-service-config
    namespace: asset-service-dev
    literals:
      - QUARKUS_OTEL_TRACES_SAMPLER_ARG=1.0
      - QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT=http://box1-collector.box1-observability.svc:4317
      - QUARKUS_OTEL_RESOURCE_ATTRIBUTES=deployment.environment=dev
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp


      - KAFKA_BOOTSTRAP_SERVERS=box1-kafka-kafka-bootstrap.box1-kafka.svc:9092

images:
  - name: asset-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/asset-service
    digest: sha256:74566af8776dad2489c0f3a68cfb1cbfa6ee3cb0a87665d9610f6dc2c0868ea1
