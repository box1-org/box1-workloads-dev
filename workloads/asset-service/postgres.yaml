# PostgreSQL for asset-service (box1-docs#15, decision D-014).
# Unlike the template pattern, this file holds NO Secret. Secret asset-service-postgres is created out of band,
# once, with keys POSTGRESQL_DATABASE, POSTGRESQL_USER and POSTGRESQL_PASSWORD (see the service runbook).
# Argo CD does not manage it. Until it exists, both pods wait in CreateContainerConfigError, which is harmless.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asset-service-postgres-data
  namespace: asset-service-dev
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-service-postgres
  namespace: asset-service-dev
  labels:
    app.kubernetes.io/name: asset-service-postgres
    app.kubernetes.io/part-of: asset-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: asset-service-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asset-service-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15@sha256:95e94264e14133d80ddbc9980eeebf4806d6668a61cbc1917e57efa1941b516b
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: asset-service-postgres
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U \"$POSTGRESQL_USER\" -d \"$POSTGRESQL_DATABASE\""]
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: asset-service-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: asset-service-postgres
  namespace: asset-service-dev
spec:
  selector:
    app.kubernetes.io/name: asset-service-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: asset-service-postgres
  namespace: asset-service-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: asset-service-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: asset-service
      ports:
        - protocol: TCP
          port: 5432
