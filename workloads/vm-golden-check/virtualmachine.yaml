# Halted until the first promotion records the OS image, adds datavolume.yaml to the
# kustomization and sets runStrategy: Always. Later promotions only update the
# box1.org/* annotations (no restart); apply them in the guest with
# `sudo bootc upgrade --apply`.
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: "vm-golden-check"
  namespace: "vm-golden-check-dev"
  annotations:
    box1.org/os-image-digest: sha256:3a0d52cef40fb77e58b56be7df0b99abe4a2ee9659bde0bf622a9f9f328020be
    box1.org/source-revision: 21a898e7fac7ff050e377b4c288ad0ea335f1c00
    box1.org/build-pipelinerun: box1-ci/vm-golden-check-release-96cls
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: "vm-golden-check"
    spec:
      accessCredentials:
        - sshPublicKey:
            source:
              secret:
                secretName: "vm-golden-check-admin-ssh"
            propagationMethod:
              qemuGuestAgent:
                users: [cloud-user]
      domain:
        cpu:
          cores: 2
        memory:
          guest: 4Gi
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          autoattachSerialConsole: true
          rng: {}
          disks:
            - name: root
              bootOrder: 1
              disk:
                bus: virtio
            # Read by box1-registry-setup.service as /dev/disk/by-id/virtio-<serial>.
            - name: serviceca
              serial: serviceca
              disk:
                bus: virtio
            - name: regtoken
              serial: regtoken
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: root
          dataVolume:
            name: "vm-golden-check-root"
        - name: serviceca
          configMap:
            name: openshift-service-ca.crt
        - name: regtoken
          secret:
            secretName: "vm-golden-check-updater-token"
