# Pull identity the guest uses for `bootc upgrade` from box1-ci/vm-golden-check:development.
# Pull rights come from the Group binding in onboarding.yaml. The token controller
# fills the Secret; no credential value is stored in Git.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "vm-golden-check-updater"
  namespace: "vm-golden-check-dev"
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: "vm-golden-check-updater-token"
  namespace: "vm-golden-check-dev"
  annotations:
    kubernetes.io/service-account.name: "vm-golden-check-updater"
type: kubernetes.io/service-account-token
