apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: quarkus-reference
labels:
  - pairs:
      backstage.io/kubernetes-id: quarkus-reference
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
configMapGenerator:
  - name: quarkus-reference-config
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -Djava.io.tmpdir=/tmp
images:
  - name: quarkus-reference
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/quarkus-reference
    digest: sha256:2ec68e92d1189374ae95d02ca12a7d9abec2b6a7bb1d5e50e5367cb5b9dddb8b
