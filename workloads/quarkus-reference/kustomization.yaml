apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: quarkus-reference
labels:
  - pairs:
      backstage.io/kubernetes-id: quarkus-reference
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
configMapGenerator:
  - name: quarkus-reference-config
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -Djava.io.tmpdir=/tmp
images:
  - name: quarkus-reference
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/quarkus-reference
    digest: sha256:ccf7ffa3d1f8f57dc549b9dbd88c20660c40b4bfa4b02846c0ee5a052f6f8fa5
