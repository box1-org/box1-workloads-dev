apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: world-series-service
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml
configMapGenerator:
  - name: world-series-service-config
    namespace: world-series-service-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -Djava.io.tmpdir=/tmp
images:
  - name: world-series-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/world-series-service
    digest: sha256:7bbae09dc1fe06f8aff7252354a10d6bb9bbf7d9f4719b2d79be1c96355194b4
