apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: qs-regression-check
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml

configMapGenerator:
  - name: qs-regression-check-config
    namespace: qs-regression-check-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp


images:
  - name: qs-regression-check
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/qs-regression-check
    digest: sha256:146f060f1aa61b9f62ec98d147f731248b18b2fb1dff9f9be6519518b5e7cf51
