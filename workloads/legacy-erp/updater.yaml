# Pull identity the guest uses for `bootc upgrade` from box1-ci/legacy-erp:development.
# Pull rights come from the Group binding in onboarding.yaml. The token controller
# fills the Secret; no credential value is stored in Git.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "legacy-erp-updater"
  namespace: "legacy-erp-dev"
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: "legacy-erp-updater-token"
  namespace: "legacy-erp-dev"
  annotations:
    kubernetes.io/service-account.name: "legacy-erp-updater"
type: kubernetes.io/service-account-token
