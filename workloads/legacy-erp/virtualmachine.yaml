# Halted until the first promotion records the OS image, adds datavolume.yaml to the
# kustomization and sets runStrategy: Always. Later promotions only update the
# box1.org/* annotations (no restart); apply them in the guest with
# `sudo bootc upgrade --apply`.
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: "legacy-erp"
  namespace: "legacy-erp-dev"
  annotations:
    box1.org/os-image-digest: sha256:71bbe4a18875dff5f610f7a775a42e60d82eb67c2895ab3769ebe1c68c8eaed6
    box1.org/source-revision: 169248f77702b1c92554344e823c3444929e6cde
    box1.org/build-pipelinerun: box1-ci/box1-ops-erp-simulator-release-bgnlm
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: "legacy-erp"
    spec:
      accessCredentials:
        - sshPublicKey:
            source:
              secret:
                secretName: "legacy-erp-admin-ssh"
            propagationMethod:
              qemuGuestAgent:
                users: [cloud-user]
        # Pipeline deploys only (deploy-access.yaml); sudo limited to bootc in the image.
        - sshPublicKey:
            source:
              secret:
                secretName: "legacy-erp-deploy-ssh"
            propagationMethod:
              qemuGuestAgent:
                users: [box1-deploy]
      domain:
        cpu:
          cores: 2
        memory:
          guest: 4Gi
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          autoattachSerialConsole: true
          rng: {}
          disks:
            - name: root
              bootOrder: 1
              disk:
                bus: virtio
            # Read by box1-registry-setup.service as /dev/disk/by-id/virtio-<serial>.
            - name: serviceca
              serial: serviceca
              disk:
                bus: virtio
            - name: regtoken
              serial: regtoken
              disk:
                bus: virtio
            # ERP data disk, mounted at /srv/box1-erp from /dev/disk/by-id/virtio-erpdata.
            - name: erpdata
              serial: erpdata
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: root
          dataVolume:
            name: "legacy-erp-root"
        - name: serviceca
          configMap:
            name: openshift-service-ca.crt
        - name: regtoken
          secret:
            secretName: "legacy-erp-updater-token"
        - name: erpdata
          persistentVolumeClaim:
            claimName: "legacy-erp-data"
