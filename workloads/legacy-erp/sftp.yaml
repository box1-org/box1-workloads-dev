# ERP SFTP endpoint for the fulfillment adapter (box1-docs#25). In the guest,
# box1-erp-sftpd listens on 2222 (SFTP-only, account erpsftp, chrooted to the
# exchange). Internal only: no Route, and only the adapter's pods may reach 2222.
# Port 22 (admin sshd, key-only) stays open as before this policy existed:
# `virtctl ssh` port-forwards reach the VM pod as ordinary ingress, so admin
# access and the pipeline's box1-bootc-apply deploys depend on it.
---
apiVersion: v1
kind: Service
metadata:
  name: "legacy-erp-sftp"
  namespace: "legacy-erp-dev"
spec:
  type: ClusterIP
  selector:
    vm.kubevirt.io/name: "legacy-erp"
  ports:
  - name: sftp
    protocol: TCP
    port: 22
    targetPort: 2222
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "legacy-erp-sftp"
  namespace: "legacy-erp-dev"
spec:
  podSelector:
    matchLabels:
      vm.kubevirt.io/name: "legacy-erp"
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: fulfillment-adapter-dev
      podSelector:
        matchLabels:
          app.kubernetes.io/name: fulfillment-adapter
    ports:
    - protocol: TCP
      port: 2222
  - ports:
    - protocol: TCP
      port: 22
