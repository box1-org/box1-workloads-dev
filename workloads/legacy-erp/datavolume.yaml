# Root disk, imported once from the pipeline-built containerDisk. Not listed in
# kustomization.yaml until the first promotion sets the digest: DataVolume specs are
# immutable, so a placeholder source must never be created.
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: "legacy-erp-root"
  namespace: "legacy-erp-dev"
  annotations:
    cdi.kubevirt.io/storage.bind.immediate.requested: "false"
spec:
  source:
    registry:
      url: docker://image-registry.openshift-image-registry.svc:5000/box1-ci/legacy-erp-disk@sha256:59c835d093d8b8f35d2f0380280d86efdaee2208015d290b33afc7f315fb558a
      pullMethod: node
  storage:
    storageClassName: lvms-vg1
    volumeMode: Block
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 20Gi
