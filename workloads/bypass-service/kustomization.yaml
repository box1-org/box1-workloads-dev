apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: bypass-service
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml

configMapGenerator:
  - name: bypass-service-config
    namespace: bypass-service-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -Djava.io.tmpdir=/tmp

images:
  - name: bypass-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/bypass-service
    digest: sha256:d2c3319c23a5ab847efe1a6c0022aad92b79d0a00154630011ce503480ae0c0f
