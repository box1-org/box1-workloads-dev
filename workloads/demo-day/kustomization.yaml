apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: demo-day
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml

  - postgres.yaml

configMapGenerator:
  - name: demo-day-config
    namespace: demo-day-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp

      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://demo-day-postgres:5432/demo_day
      - QUARKUS_DATASOURCE_USERNAME=demo_day


      - KAFKA_BOOTSTRAP_SERVERS=box1-kafka-kafka-bootstrap.box1-kafka.svc:9092

images:
  - name: demo-day
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/demo-day
    digest: sha256:391e39ebb1b06eeaed3e579cc255112a67a8c0151d3b8833fb64288ad987a5c7
