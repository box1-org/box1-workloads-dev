apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: shipping-service
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml
configMapGenerator:
  - name: shipping-service-config
    namespace: shipping-service-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -Djava.io.tmpdir=/tmp
images:
  - name: shipping-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/shipping-service
    digest: sha256:08022c4fb26835ef1b2c1b8bcea8e5ceebe81f130dd4b66cbf50bb05001df706
