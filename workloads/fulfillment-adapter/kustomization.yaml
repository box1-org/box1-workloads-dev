apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: fulfillment-adapter
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml
  - rolebinding-agentic-operations-observe.yaml
  - postgres.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: fulfillment-adapter-config
    namespace: fulfillment-adapter-dev
    literals:
      - QUARKUS_OTEL_TRACES_SAMPLER_ARG=1.0
      - QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT=http://box1-collector.box1-observability.svc:4317
      - QUARKUS_OTEL_RESOURCE_ATTRIBUTES=deployment.environment=dev
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp


      - KAFKA_BOOTSTRAP_SERVERS=box1-kafka-kafka-bootstrap.box1-kafka.svc:9092

images:
  - name: fulfillment-adapter
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/fulfillment-adapter
    digest: sha256:a3dee64ffc0c02366497488b1439ed871d70ca3f96cef3bf611f5cc31ae7d101
