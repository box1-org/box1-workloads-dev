apiVersion: v1
kind: Namespace
metadata:
  name: fulfillment-adapter-dev
  labels:
    argocd.argoproj.io/managed-by: openshift-gitops
    pod-security.kubernetes.io/enforce: restricted
    # Istio ambient L4 (box1-docs#23): seen by the mesh, traffic captured by
    # ztunnel. Remove both labels to leave the mesh.
    istio-discovery: enabled
    istio.io/dataplane-mode: ambient
