apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillment-adapter
  namespace: fulfillment-adapter-dev
  annotations:
    box1.org/source-revision: f1df453457ad2fdd09475a2cb472494c3150b7e9
    box1.org/build-pipelinerun: box1-ci/fulfillment-adapter-release-sr5pj
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fulfillment-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fulfillment-adapter
        app.kubernetes.io/part-of: box1-golden-path
    spec:
      serviceAccountName: fulfillment-adapter
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: fulfillment-adapter
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fulfillment-adapter-config
            # Created out of band before sync; never in Git (see postgres.yaml, box1-docs#41).
            - secretRef:
                name: fulfillment-adapter-postgres
          # Plain env entries, not generator literals, so a change cannot orphan a hashed ConfigMap.
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://fulfillment-adapter-postgres:5432/fulfillment_adapter
            - name: QUARKUS_DATASOURCE_USERNAME
              value: fulfillment_adapter
            # ERP VM SFTP endpoint (box1-docs#25): Service legacy-erp-sftp:22 -> guest 2222, admitted
            # only from this Deployment's pods. Key and known_hosts: Secret fulfillment-adapter-sftp (out of band).
            - name: FULFILLMENT_SFTP_ENABLED
              value: "true"
            - name: FULFILLMENT_SFTP_HOST
              value: legacy-erp-sftp.legacy-erp-dev.svc
            - name: FULFILLMENT_SFTP_PORT
              value: "22"
            # Status reads carry IDs and codes only (D-016); writes and /internal always need the role.
            - name: FULFILLMENT_READ_POLICY
              value: permit
            # A heap OOM could otherwise leave a live pod with a dead consumer.
            - name: JDK_JAVA_OPTIONS
              value: "-XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            # Covers the datasource acquisition timeout (5 s) when the pool is busy.
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: sftp
              mountPath: /var/run/secrets/box1/sftp
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # id_ed25519 and known_hosts, provisioned out of band after approval (D-007). Optional: absent until then.
        - name: sftp
          secret:
            secretName: fulfillment-adapter-sftp
            optional: true
            defaultMode: 0440
