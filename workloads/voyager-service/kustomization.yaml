apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: voyager-service
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml

configMapGenerator:
  - name: voyager-service-config
    namespace: voyager-service-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp


images:
  - name: voyager-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/voyager-service
    digest: sha256:b596b083fe25c127e5d6b1cbfb2426d3fb690780638b6e4495e2609283b81529
