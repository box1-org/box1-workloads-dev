apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: inventory-service-dev
  annotations:
    box1.org/source-revision: c7ddc2d0c9f2b3ae5f7468a49b266f912b73e2b7
    box1.org/build-pipelinerun: box1-ci/inventory-service-release-qd86b
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
        app.kubernetes.io/part-of: box1-golden-path
    spec:
      serviceAccountName: inventory-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: inventory-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Order events older than this have no effect. A plain env, not a generator literal,
            # so changing it cannot orphan a hashed ConfigMap. See the service runbook.
            - name: INVENTORY_ORDER_EVENTS_FLOOR
              value: "2026-11-05T17:00:00Z"
            # Anonymous reads of stock and reservations; no customer data (box1-docs#12 D-011).
            - name: INVENTORY_READ_POLICY
              value: permit
            # A heap OOM could otherwise leave a live pod with a dead consumer.
            - name: JDK_JAVA_OPTIONS
              value: "-XX:+ExitOnOutOfMemoryError"
          envFrom:
            - configMapRef:
                name: inventory-service-config

            - secretRef:
                name: inventory-service-postgres

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
