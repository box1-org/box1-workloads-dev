apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: inventory-service
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml

  - postgres.yaml

configMapGenerator:
  - name: inventory-service-config
    namespace: inventory-service-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp

      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://inventory-service-postgres:5432/inventory_service
      - QUARKUS_DATASOURCE_USERNAME=inventory_service


      - KAFKA_BOOTSTRAP_SERVERS=box1-kafka-kafka-bootstrap.box1-kafka.svc:9092

images:
  - name: inventory-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/inventory-service
    digest: sha256:ccc4b910d1aa97d6acec9efd904618fa0a4083dbd89d0b4e9baa04eb36a0ebb6
