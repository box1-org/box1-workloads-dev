apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: inventory-service
    includeSelectors: false
    includeTemplates: true
resources:
  - waypoint.yaml
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml
  - rolebinding-agentic-operations-observe.yaml

  - postgres.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: inventory-service-config
    namespace: inventory-service-dev
    literals:
      - QUARKUS_OTEL_TRACES_SAMPLER_ARG=1.0
      - QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT=http://box1-collector.box1-observability.svc:4317
      - QUARKUS_OTEL_RESOURCE_ATTRIBUTES=deployment.environment=dev
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp

      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://inventory-service-postgres:5432/inventory_service
      - QUARKUS_DATASOURCE_USERNAME=inventory_service


      - KAFKA_BOOTSTRAP_SERVERS=box1-kafka-kafka-bootstrap.box1-kafka.svc:9092

images:
  - name: inventory-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/inventory-service
    digest: sha256:a31bfce1a54b73102e790ae5b291dca4d193a73fe073e13bfb4a090a3a424960
