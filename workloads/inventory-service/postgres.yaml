
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-service-postgres
  namespace: inventory-service-dev
  annotations:
    box1.org/secret-bootstrap: replace-before-sync
type: Opaque
stringData:
  POSTGRESQL_DATABASE: inventory_service
  POSTGRESQL_USER: inventory_service
  POSTGRESQL_PASSWORD: replace-before-sync
  QUARKUS_DATASOURCE_PASSWORD: replace-before-sync
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inventory-service-postgres-data
  namespace: inventory-service-dev
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service-postgres
  namespace: inventory-service-dev
  labels:
    app.kubernetes.io/name: inventory-service-postgres
    app.kubernetes.io/part-of: inventory-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service-postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15@sha256:95e94264e14133d80ddbc9980eeebf4806d6668a61cbc1917e57efa1941b516b
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: inventory-service-postgres
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U \"$POSTGRESQL_USER\" -d \"$POSTGRESQL_DATABASE\""]
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inventory-service-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service-postgres
  labels:
    # box1-docs#23: keep the DB path on ztunnel (L4), not the waypoint.
    istio.io/use-waypoint: none
  namespace: inventory-service-dev
spec:
  selector:
    app.kubernetes.io/name: inventory-service-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventory-service-postgres
  namespace: inventory-service-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: inventory-service-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: inventory-service
      ports:
        - protocol: TCP
          port: 5432
        # Istio ambient (box1-docs#23): once the namespace is enrolled, the
        # service reaches Postgres through ztunnel over HBONE on 15008.
        - protocol: TCP
          port: 15008

