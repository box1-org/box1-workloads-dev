apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: halloween-service
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml
configMapGenerator:
  - name: halloween-service-config
    namespace: halloween-service-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -Djava.io.tmpdir=/tmp
images:
  - name: halloween-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/halloween-service
    digest: sha256:adccbf44448a199df2ac2a5aa0bda27494102b866464d710d082a0aed1f0e2bc
