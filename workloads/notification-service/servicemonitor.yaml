# Scraped by OpenShift user-workload monitoring (box1-docs#22).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: notification-service
  namespace: notification-service-dev
spec:
  selector:
    matchLabels:
      backstage.io/kubernetes-id: notification-service
  endpoints:
    - port: http
      path: /q/metrics
      interval: 30s
      scrapeTimeout: 10s
