apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: notification-service-dev
  annotations:
    box1.org/source-revision: 24dda0f28f4b68992eed276ee701bdf33125cf80
    box1.org/build-pipelinerun: box1-ci/notification-service-release-6x952
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: box1-golden-path
    spec:
      serviceAccountName: notification-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: notification-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: notification-service-config
          # Settings added after onboarding live here, not in the hashed ConfigMap (box1-docs#42 lesson).
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # First-start offset policy (box1-docs#16 D-006): events that occurred before this instant never become
            # notices, so the new consumer group does not turn order and shipment history into a flood of notices.
            - name: NOTIFY_EVENTS_FLOOR
              value: '2026-11-06T18:03:00Z'
            # Stub fault control: the user named notification-service-dev as the demo namespace (box1-docs#16, 2026-11-06).
            # Each fault run still needs approval; TTL, bounds and audit are enforced by the service.
            - name: NOTIFY_STUB_FAULTS_ENABLED
              value: 'true'
            - name: NOTIFY_STUB_FAULT_NAMESPACES
              value: notification-service-dev
            # Operator console tokens are accepted for reading only (user decision 2026-11-06, box1-docs#16 D-007):
            # console-viewer/console-operator -> notification-reader; never fault control.
            - name: NOTIFY_AUTH_CONSOLE_CLIENT_ID
              value: operations-console
            - name: NOTIFY_JWT_AUDIENCES
              value: notification-service,operations-console
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://notification-service-postgres:5432/notification_service
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notification-service-postgres
                  key: POSTGRESQL_USER
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-service-postgres
                  key: POSTGRESQL_PASSWORD
            - name: JDK_JAVA_OPTIONS
              value: -XX:+ExitOnOutOfMemoryError

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
