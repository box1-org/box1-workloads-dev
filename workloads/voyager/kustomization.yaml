apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: voyager
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml

  - postgres.yaml

configMapGenerator:
  - name: voyager-config
    namespace: voyager-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -Djava.io.tmpdir=/tmp

      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://voyager-postgres:5432/voyager
      - QUARKUS_DATASOURCE_USERNAME=voyager

images:
  - name: voyager
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/voyager
    digest: sha256:69152de82bb2952782e793c0eeb1a126fcb8363d5e9c08771dd5a26d9a3c69b5
