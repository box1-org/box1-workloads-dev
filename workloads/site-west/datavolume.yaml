# Root disk, imported once from the source's install disk box1-ci/site-gateway-os-disk.
# Not listed in kustomization.yaml until the first promotion sets the digest of the disk
# built for the source's approved revision. DataVolume specs are immutable, so a
# placeholder source must never be created, and later promotions do not change it.
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: "site-west-root"
  namespace: "site-west-dev"
  annotations:
    cdi.kubevirt.io/storage.bind.immediate.requested: "false"
spec:
  source:
    registry:
      url: docker://image-registry.openshift-image-registry.svc:5000/box1-ci/site-gateway-os-disk@sha256:fedaec296ad7953b51579b06d912d64f958f6e143be953618e2b97d891c41cd5
      pullMethod: node
  storage:
    storageClassName: lvms-vg1
    volumeMode: Block
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 20Gi
