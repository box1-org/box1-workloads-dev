apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: post-show
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml

  - postgres.yaml

configMapGenerator:
  - name: post-show-config
    namespace: post-show-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -Djava.io.tmpdir=/tmp

      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://post-show-postgres:5432/post_show
      - QUARKUS_DATASOURCE_USERNAME=post_show

images:
  - name: post-show
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/post-show
    digest: sha256:d896e736b0d73e3fe3d52de4b6074349ce5e61ffdfc875cd90f710eb451b649b
