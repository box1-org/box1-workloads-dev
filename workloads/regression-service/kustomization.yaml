apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: regression-service
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml

configMapGenerator:
  - name: regression-service-config
    namespace: regression-service-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp


images:
  - name: regression-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/regression-service
    digest: sha256:cccf42090100344db3460b8e911971239af0ca62c8fde5a10ec4d0ff9883f7cf
