apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: agentic-operations
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml
  - rolebinding-agentic-operations-observe.yaml
  - service-ca.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: agentic-operations-config
    namespace: agentic-operations-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp


      - KAFKA_BOOTSTRAP_SERVERS=box1-kafka-kafka-bootstrap.box1-kafka.svc:9092

images:
  - name: agentic-operations
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/agentic-operations
    digest: sha256:644628dc6b58d717cadc5750e20fe98ff04cdf9a8eaf7d9f598b8b32442e67b7
