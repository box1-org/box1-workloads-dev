apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-operations
  namespace: agentic-operations-dev
  annotations:
    box1.org/source-revision: 95d58bcda32d1f20d97111c8618f2daa706af477
    box1.org/build-pipelinerun: box1-ci/agentic-operations-release-db9wj
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  # One pod at a time (box1-docs#20 D-003, D-007; review R-4, M-2). Analyses and the Kafka evidence window live in
  # memory in one pod. Two pods behind the Service would split GETs and Kafka partitions, so a rollout replaces the
  # pod and briefly has none.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-operations
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-operations
        app.kubernetes.io/part-of: box1-golden-path
    spec:
      serviceAccountName: agentic-operations
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: agentic-operations
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: agentic-operations-config
          # Runtime settings in env, not ConfigMap literals: changing a hashed ConfigMap literal orphans the old
          # ConfigMap and fails the release smoke check (see operations-console).
          env:
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://box1-collector.box1-observability.svc:4317
            - name: QUARKUS_OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: QUARKUS_OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=dev
            - name: OIDC_AUTH_SERVER_URL
              value: https://keycloak.apps.ocp.box1.org/auth/realms/box1
            # operations-console: the console's Assistant forwards the person's token (box1-docs#101); the
            # person's own aiops role is still checked in the service layer.
            - name: AIOPS_ALLOWED_AZP
              value: agentic-operations-cli,operations-console
            - name: AIOPS_CONSUMER_GROUP
              value: agentic-operations
            # In-cluster vLLM only; never the public route (box1-docs#20 Q-3, #26).
            - name: VLLM_BASE_URL
              value: http://vllm-test-2.vllm.svc:8000/v1
            - name: MODEL_ID
              value: box1-coder
            - name: ORDER_SERVICE_URL
              value: http://order-service.order-service-dev.svc:8080
            - name: INVENTORY_SERVICE_URL
              value: http://inventory-service.inventory-service-dev.svc:8080
            - name: FULFILLMENT_ADAPTER_URL
              value: http://fulfillment-adapter.fulfillment-adapter-dev.svc:8080
            # Platform evidence (box1-docs#111): read with the pod's own projected ServiceAccount token over TLS
            # trusting only the service CA. Namespace scope comes from RoleBindings in each box1 namespace.
            - name: AIOPS_PLATFORM_TOKEN_PATH
              value: /var/run/secrets/box1/platform/token
            - name: AIOPS_PLATFORM_CA_PATH
              value: /var/run/secrets/box1/service-ca/service-ca.crt
            - name: AIOPS_TEMPO_URL
              value: https://tempo-box1-gateway.box1-observability.svc:8080/api/traces/v1/dev/tempo
            - name: AIOPS_LOKI_URL
              value: https://logging-loki-gateway-http.openshift-logging.svc:8080/api/logs/v1/application
            - name: AIOPS_THANOS_TENANCY_URL
              value: https://thanos-querier.openshift-monitoring.svc:9092
            - name: AIOPS_ALERTMANAGER_TENANCY_URL
              value: https://alertmanager-main.openshift-monitoring.svc:9092

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: platform-token
              mountPath: /var/run/secrets/box1/platform
              readOnly: true
            - name: service-ca
              mountPath: /var/run/secrets/box1/service-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # The ServiceAccount token for platform reads only (box1-docs#111). automountServiceAccountToken stays false:
        # this projected token is short-lived, rotated by the kubelet, and mounted at a path only the platform client
        # reads. It carries no Kubernetes API permissions beyond the read-only bindings named in #111.
        - name: platform-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
        - name: service-ca
          configMap:
            name: agentic-operations-service-ca
