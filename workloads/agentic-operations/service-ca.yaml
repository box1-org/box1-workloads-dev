# The OpenShift service CA, injected by the service-ca operator. agentic-operations trusts only this CA for the
# platform reads (Tempo gateway, LokiStack gateway, Thanos querier and Alertmanager tenancy ports; box1-docs#111).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-operations-service-ca
  namespace: agentic-operations-dev
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
