# Pull identity the guest uses for `bootc upgrade` from box1-ci/site-gateway-os:development.
# Pull rights come from the Group binding in onboarding.yaml. The token controller
# fills the Secret; no credential value is stored in Git.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "site-gateway-os-updater"
  namespace: "site-gateway-os-dev"
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: "site-gateway-os-updater-token"
  namespace: "site-gateway-os-dev"
  annotations:
    kubernetes.io/service-account.name: "site-gateway-os-updater"
type: kubernetes.io/service-account-token
