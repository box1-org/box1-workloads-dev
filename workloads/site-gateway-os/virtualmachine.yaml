# Halted until the first promotion records the OS image, adds datavolume.yaml to the
# kustomization and sets runStrategy: Always. Later promotions only update the
# box1.org/* annotations (no restart); apply them in the guest with
# `sudo bootc upgrade --apply`.
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: "site-gateway-os"
  namespace: "site-gateway-os-dev"
  annotations:
    box1.org/os-image-digest: sha256:0b1f8d0f313aa90c5cd202ee1377353b2cc01fe514dc5cb3e4246996e3cd9a22
    box1.org/source-revision: e50b3d709a56a2e33b0e0b7b4d88e18b7bb3098a
    box1.org/build-pipelinerun: box1-ci/site-gateway-os-release-8jdcf
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: "site-gateway-os"
    spec:
      accessCredentials:
        - sshPublicKey:
            source:
              secret:
                secretName: "site-gateway-os-admin-ssh"
            propagationMethod:
              qemuGuestAgent:
                users: [cloud-user]
      domain:
        cpu:
          cores: 2
        memory:
          guest: 4Gi
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          autoattachSerialConsole: true
          rng: {}
          disks:
            - name: root
              bootOrder: 1
              disk:
                bus: virtio
            # Read by box1-registry-setup.service as /dev/disk/by-id/virtio-<serial>.
            - name: serviceca
              serial: serviceca
              disk:
                bus: virtio
            - name: regtoken
              serial: regtoken
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: root
          dataVolume:
            name: "site-gateway-os-root"
        - name: serviceca
          configMap:
            name: openshift-service-ca.crt
        - name: regtoken
          secret:
            secretName: "site-gateway-os-updater-token"
