apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: trash-service
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml

  - postgres.yaml

configMapGenerator:
  - name: trash-service-config
    namespace: trash-service-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -Djava.io.tmpdir=/tmp

      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://trash-service-postgres:5432/trash_service
      - QUARKUS_DATASOURCE_USERNAME=trash_service

images:
  - name: trash-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/trash-service
    digest: sha256:b5fb306d2282a652828f41fbf21e21394226ec984fe3b893ffab4b4488b2be72
