
---
apiVersion: v1
kind: Secret
metadata:
  name: blue-wave-postgres
  namespace: blue-wave-dev
  annotations:
    box1.org/secret-bootstrap: replace-before-sync
type: Opaque
stringData:
  POSTGRESQL_DATABASE: blue_wave
  POSTGRESQL_USER: blue_wave
  POSTGRESQL_PASSWORD: replace-before-sync
  QUARKUS_DATASOURCE_PASSWORD: replace-before-sync
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blue-wave-postgres-data
  namespace: blue-wave-dev
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-wave-postgres
  namespace: blue-wave-dev
  labels:
    app.kubernetes.io/name: blue-wave-postgres
    app.kubernetes.io/part-of: blue-wave
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: blue-wave-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blue-wave-postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15@sha256:95e94264e14133d80ddbc9980eeebf4806d6668a61cbc1917e57efa1941b516b
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: blue-wave-postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U \"$POSTGRESQL_USER\" -d \"$POSTGRESQL_DATABASE\""]
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: blue-wave-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: blue-wave-postgres
  namespace: blue-wave-dev
spec:
  selector:
    app.kubernetes.io/name: blue-wave-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

