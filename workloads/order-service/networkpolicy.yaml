---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-service-postgres
  namespace: order-service-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order-service-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
      ports:
        - protocol: TCP
          port: 5432
