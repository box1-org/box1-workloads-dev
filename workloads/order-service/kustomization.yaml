apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: order-service
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml

  - postgres.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: order-service-config
    namespace: order-service-dev
    literals:
      - QUARKUS_OTEL_TRACES_SAMPLER_ARG=1.0
      - QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT=http://box1-collector.box1-observability.svc:4317
      - QUARKUS_OTEL_RESOURCE_ATTRIBUTES=deployment.environment=dev
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp

      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://order-service-postgres:5432/order_service
      - QUARKUS_DATASOURCE_USERNAME=order_service
      - KAFKA_BOOTSTRAP_SERVERS=box1-kafka-kafka-bootstrap.box1-kafka.svc:9092

images:
  - name: order-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/order-service
    digest: sha256:5e4e66f6ba3c9eeb3b090dd9aea982743c425cc715044fefd8bacfb3e1bc9cc0
