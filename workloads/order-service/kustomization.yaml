apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: order-service
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml

  - postgres.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: order-service-config
    namespace: order-service-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp

      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://order-service-postgres:5432/order_service
      - QUARKUS_DATASOURCE_USERNAME=order_service
      - KAFKA_BOOTSTRAP_SERVERS=box1-kafka-kafka-bootstrap.box1-kafka.svc:9092

images:
  - name: order-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/order-service
    digest: sha256:69e4e88f6b2dcadd67e593e7023255d054223291498f1ce1fb6fa82d9b82ae03
