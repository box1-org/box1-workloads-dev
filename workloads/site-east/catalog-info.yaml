# Developer Hub entity for this instance (box1-docs#138). An instance has no source
# repository, so its catalog entry lives beside its GitOps bundle. Not a Kubernetes
# resource: kustomization.yaml does not list it.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: site-east
  description: "VM instance of site-gateway-os for site site_spacedock"
  annotations:
    backstage.io/kubernetes-id: site-east
    backstage.io/source-location: url:https://github.com/box1-org/box1-workloads-dev/tree/main/workloads/site-east/
    argocd/instance-name: openshift-gitops
    argocd/app-selector: backstage.io/kubernetes-id=site-east
    box1.org/workload-profile: vm-instance
    box1.org/source-image: site-gateway-os
    box1.org/site-id: site_spacedock
    box1.org/template-version: "1.0.0"
  tags: [vm-instance, rhel, bootc, image-mode, kubevirt, gitops]
  links:
    - url: https://console-openshift-console.apps.ocp.box1.org/k8s/ns/site-east-dev/kubevirt.io~v1~VirtualMachine/site-east
      title: Virtual machine (OpenShift console)
    - url: https://github.com/box1-org/box1-workloads-dev/tree/main/workloads/site-east
      title: Desired VM configuration
    - url: https://github.com/box1-org/site-gateway-os
      title: Source OS image repository
      icon: github
spec:
  type: vm-instance
  lifecycle: experimental
  owner: "user:default/mike"
  dependsOn:
    - component:default/site-gateway-os
