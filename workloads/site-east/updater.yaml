# Pull identity the guest uses for registry access to box1-ci (box1-registry-setup in
# the source image). Pull rights come from the Group binding in onboarding.yaml. The
# token controller fills the Secret; no credential value is stored in Git.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "site-east-updater"
  namespace: "site-east-dev"
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: "site-east-updater-token"
  namespace: "site-east-dev"
  annotations:
    kubernetes.io/service-account.name: "site-east-updater"
type: kubernetes.io/service-account-token
