apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario-controller
  namespace: scenario-controller-dev
  annotations:
    box1.org/source-revision: 23125f8c4eb8f8f522caf0ba3febe85628e7f7ea
    box1.org/build-pipelinerun: box1-ci/scenario-controller-release-2cpdn
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  # One replica, never two at once: a new pod aborts any open run at startup, so it must not overlap the old pod
  # (box1-docs#19 review ARCH-1/OPS-1/PERS-5). A rollout has a short gap instead.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scenario-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scenario-controller
        app.kubernetes.io/part-of: box1-golden-path
    spec:
      serviceAccountName: scenario-controller
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: scenario-controller
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Scenario control (box1-docs#19, D-006, D-009). Both gates are required; the namespace comes from the
          # downward API, so a copy deployed elsewhere refuses every scenario.
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SCENARIO_CONTROL_ENABLED
              value: "true"
            - name: SCENARIO_NAMESPACE_ALLOWLIST
              value: scenario-controller-dev
            - name: SCENARIO_ENVIRONMENT
              value: dev
            - name: ORDER_SERVICE_URL
              value: http://order-service.order-service-dev.svc:8080
            - name: INVENTORY_SERVICE_URL
              value: http://inventory-service.inventory-service-dev.svc:8080
            - name: FULFILLMENT_ADAPTER_URL
              value: http://fulfillment-adapter.fulfillment-adapter-dev.svc:8080
            # People call the controller with tokens from the public CLI client; roles come from scenario-controller.
            # Gate 3: the upstream and token URL hosts must be on this list.
            - name: SCENARIO_UPSTREAM_HOST_ALLOWLIST
              value: order-service.order-service-dev.svc,inventory-service.inventory-service-dev.svc,fulfillment-adapter.fulfillment-adapter-dev.svc,keycloak.apps.ocp.box1.org
            # Clients whose tokens may carry scenario roles: the CLI, and the operations console's Demo control (box1-docs#19).
            - name: SCENARIO_ALLOWED_AZP
              value: scenario-controller-cli,operations-console
            # Inventory admin identity: the scenario-controller client's service account. The secret is provisioned
            # by the user (approval-gated) into Secret scenario-controller-inventory-token; until it exists, seeding
            # and reset report "Inventory admin identity is not configured".
            - name: INVENTORY_TOKEN_URL
              value: https://keycloak.apps.ocp.box1.org/auth/realms/box1/protocol/openid-connect/token
            - name: INVENTORY_TOKEN_CLIENT_ID
              value: scenario-controller
            - name: INVENTORY_TOKEN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: scenario-controller-inventory-token
                  key: client-secret
                  optional: true
            - name: JDK_JAVA_OPTIONS
              value: -XX:+ExitOnOutOfMemoryError
          envFrom:
            - configMapRef:
                name: scenario-controller-config

            - secretRef:
                name: scenario-controller-postgres

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
