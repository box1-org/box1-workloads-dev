apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: scenario-controller
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml
  - rolebinding-agentic-operations-observe.yaml

  - postgres.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: scenario-controller-config
    namespace: scenario-controller-dev
    literals:
      - QUARKUS_OTEL_TRACES_SAMPLER_ARG=1.0
      - QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT=http://box1-collector.box1-observability.svc:4317
      - QUARKUS_OTEL_RESOURCE_ATTRIBUTES=deployment.environment=dev
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp

      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://scenario-controller-postgres:5432/scenario_controller
      - QUARKUS_DATASOURCE_USERNAME=scenario_controller


      - KAFKA_BOOTSTRAP_SERVERS=box1-kafka-kafka-bootstrap.box1-kafka.svc:9092

images:
  - name: scenario-controller
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/scenario-controller
    digest: sha256:bc7b8981d39de608fb3e7d0dfb90d959d2e7caa40c548cd35db2806298401ad9
