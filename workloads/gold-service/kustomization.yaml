apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: gold-service
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml

configMapGenerator:
  - name: gold-service-config
    namespace: gold-service-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -Djava.io.tmpdir=/tmp

images:
  - name: gold-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/gold-service
    digest: sha256:b48f1ccf503061f9506bba36f2ebfe56b5ca1eca944022ea7af4264ba8b4b0fc
