apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: atrioc-service
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml
configMapGenerator:
  - name: atrioc-service-config
    namespace: atrioc-service-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -Djava.io.tmpdir=/tmp
images:
  - name: atrioc-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/atrioc-service
    digest: sha256:593196ae10384e2037f2c5ae3690a6d038fb2f87367743e390f7319eb0795a4f
