apiVersion: v1
kind: Namespace
metadata:
  name: operations-console-dev
  labels:
    argocd.argoproj.io/managed-by: openshift-gitops
    pod-security.kubernetes.io/enforce: restricted
    # Istio ambient L4 (box1-docs#23): seen by the mesh and Kiali, traffic
    # captured by ztunnel. Remove both labels to leave the mesh.
    istio-discovery: enabled
    istio.io/dataplane-mode: ambient
    # L7 (box1-docs#23): this namespace's services are reached through its
    # waypoint (waypoint.yaml). Remove to return to L4 only.
    istio.io/use-waypoint: waypoint
