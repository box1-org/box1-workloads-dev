apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-console
  namespace: operations-console-dev
  annotations:
    box1.org/source-revision: 2a4035e763f0169f098da80d0b3e9de2fdaf1938
    box1.org/build-pipelinerun: box1-ci/operations-console-release-w6jj8
spec:
  # One replica: without a Secret-backed CONSOLE_SESSION_KEY each pod generates its own session key, so a second
  # replica would cause login loops and every rollout signs users out (box1-docs#18 decision D-003, as #63).
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: operations-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operations-console
        app.kubernetes.io/part-of: box1-golden-path
    spec:
      serviceAccountName: operations-console
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: operations-console
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: operations-console-config
          # Console settings (box1-docs#18). Deployment env, not ConfigMap literals: a changed literal orphans the
          # hashed ConfigMap and, without prune, Argo stays OutOfSync and the release smoke task fails.
          env:
            - name: ORDER_SERVICE_URL
              value: http://order-service.order-service-dev.svc:8080
            - name: INVENTORY_SERVICE_URL
              value: http://inventory-service.inventory-service-dev.svc:8080
            - name: FULFILLMENT_ADAPTER_URL
              value: http://fulfillment-adapter.fulfillment-adapter-dev.svc:8080
            - name: ASSET_SERVICE_URL
              value: http://asset-service.asset-service-dev.svc:8080
            # derived: order-service's internal ful_<id> convention, labelled "derived link" in the console (user
            # decision 2026-11-06, box1-docs#18 G-1). Back to none if the convention changes; the permanent fix is
            # order-service exposing fulfillmentRequestId.
            - name: CONSOLE_FULFILLMENT_LINK
              value: derived
            - name: CONSOLE_PUBLIC_ORIGIN
              value: https://operations-console-dev.apps.ocp.box1.org
            - name: CONSOLE_ENVIRONMENT
              value: operations-console-dev
            # Demo control drives the scenario controller with the signed-in person's token, sent to it and no other
            # upstream (box1-docs#19). Needs the console client's scenario-controller audience (box1-gitops) and
            # operations-console in the controller's SCENARIO_ALLOWED_AZP. Unset either to go back to read-only.
            - name: SCENARIO_CONTROLLER_URL
              value: http://scenario-controller.scenario-controller-dev.svc:8080
            - name: CONSOLE_SCENARIO_FORWARD_TOKEN
              value: "true"
            # Sites shows active asset alerts, read with the signed-in person's token, which goes to asset-service and no
            # other upstream (box1-docs#80, interim until box1-docs#79). Needs the console client's asset-service
            # audience and telemetry-reader mapping (box1-gitops) and operations-console in asset-service's
            # ASSET_READ_CLIENTS. Set "false" to go back to the telemetry-console link only.
            - name: CONSOLE_ASSET_FORWARD_TOKEN
              value: "true"
            # The Assistant (box1-docs#101): the person's own token goes to agentic-operations only; its client
            # carries audience agentic-operations and only the aiops-viewer/aiops-analyst roles (box1-gitops).
            - name: AGENTIC_OPERATIONS_URL
              value: http://agentic-operations.agentic-operations-dev.svc:8080
            - name: CONSOLE_AIOPS_FORWARD_TOKEN
              value: "true"

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
