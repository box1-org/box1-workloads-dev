apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: operations-console
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml

configMapGenerator:
  - name: operations-console-config
    namespace: operations-console-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp


images:
  - name: operations-console
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/operations-console
    digest: sha256:4c67128a2006a5a8b16c97557738551ce591be61fc9aa0ac0b037f4b1b89cf42
