apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: operations-console
    includeSelectors: false
    includeTemplates: true
resources:
  - waypoint.yaml
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: operations-console-config
    namespace: operations-console-dev
    literals:
      - QUARKUS_OTEL_TRACES_SAMPLER_ARG=1.0
      - QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT=http://box1-collector.box1-observability.svc:4317
      - QUARKUS_OTEL_RESOURCE_ATTRIBUTES=deployment.environment=dev
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp


images:
  - name: operations-console
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/operations-console
    digest: sha256:88b3f5e4e8d44b5e002c1b632a7dec817361a3c5887c64823d40182b281479e3
