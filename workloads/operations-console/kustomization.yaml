apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: operations-console
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml

configMapGenerator:
  - name: operations-console-config
    namespace: operations-console-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp


images:
  - name: operations-console
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/operations-console
    digest: sha256:e81896a82c48564dfb25c3d4805ac4a33b58a9fe51a99b788d248bdb072f22a4
