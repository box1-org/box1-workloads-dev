apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: jon-app
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml

  - postgres.yaml

configMapGenerator:
  - name: jon-app-config
    namespace: jon-app-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp

      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://jon-app-postgres:5432/jon_app
      - QUARKUS_DATASOURCE_USERNAME=jon_app


      - KAFKA_BOOTSTRAP_SERVERS=box1-kafka-kafka-bootstrap.box1-kafka.svc:9092

images:
  - name: jon-app
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/jon-app
    digest: sha256:e2cda78cab46a35e8a966af0c881d9930ac085b6c1bcf47773e601d919911a00
