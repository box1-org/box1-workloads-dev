
---
apiVersion: v1
kind: Secret
metadata:
  name: jon-app-postgres
  namespace: jon-app-dev
  annotations:
    box1.org/secret-bootstrap: replace-before-sync
type: Opaque
stringData:
  POSTGRESQL_DATABASE: jon_app
  POSTGRESQL_USER: jon_app
  POSTGRESQL_PASSWORD: replace-before-sync
  QUARKUS_DATASOURCE_PASSWORD: replace-before-sync
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jon-app-postgres-data
  namespace: jon-app-dev
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jon-app-postgres
  namespace: jon-app-dev
  labels:
    app.kubernetes.io/name: jon-app-postgres
    app.kubernetes.io/part-of: jon-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jon-app-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jon-app-postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15@sha256:95e94264e14133d80ddbc9980eeebf4806d6668a61cbc1917e57efa1941b516b
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: jon-app-postgres
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U \"$POSTGRESQL_USER\" -d \"$POSTGRESQL_DATABASE\""]
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jon-app-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: jon-app-postgres
  namespace: jon-app-dev
spec:
  selector:
    app.kubernetes.io/name: jon-app-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jon-app-postgres
  namespace: jon-app-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jon-app-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jon-app
      ports:
        - protocol: TCP
          port: 5432

